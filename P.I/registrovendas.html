    <div class="container mt-5">
        <h2>Registro de Venda</h2>
        <form>
            <div class="mb-3">
                <label for="cliente" class="form-label">Cliente</label>
                <input type="text" class="form-control" id="cliente" placeholder="Nome do cliente">
            </div>
            <div class="mb-3">
                <label for="cpfCliente" class="form-label">CPF do Cliente</label>
                <input type="text" class="form-control" id="cpfCliente" placeholder="Digite o CPF do cliente">
            </div>
            <div class="mb-3">
                <label for="produto" class="form-label">Produto</label>
                <select class="form-select" id="produto">
                    <option value="1">Produto 1</option>
                    <option value="2">Produto 2</option>
                    <!-- Listar produtos cadastrados -->
                </select>
            </div>
            <div class="mb-3">
                <label for="quantidade" class="form-label">Quantidade</label>
                <input type="number" class="form-control" id="quantidade" placeholder="Quantidade">
            </div>
            <div class="mb-3">
                <label for="dataVenda" class="form-label">Data da Venda</label>
                <input type="date" class="form-control" id="dataVenda">
            </div>
            <div class="mb-3">
                <label for="pagamento" class="form-label">Forma de Pagamento</label>
                <select class="form-select" id="pagamento">
                    <option value="dinheiro">Dinheiro</option>
                    <option value="cartao">Cartão</option>
                    <option value="pix">Pix</option>
                </select>
            </div>
            <div class="d-flex justify-content-between">
                <a href="registrovendas.html" class="btn btn-secondary">Voltar</a>
                <button type="reset" class="btn btn-warning">Limpar</button>
                <button type="submit" class="btn btn-success">Salvar</button>
            </div>
        </form>
    </div>
