    <div class="container mt-5">
        <h2>Cadastro de Produto/Serviço</h2>
        <form>
            <div class="mb-3">
                <label for="nomeProduto" class="form-label">Nome do Produto/Serviço</label>
                <input type="text" class="form-control" id="nomeProduto" placeholder="Digite o nome do produto/serviço">
            </div>
            <div class="mb-3">
                <label for="descricao" class="form-label">Descrição</label>
                <textarea class="form-control" id="descricao" rows="3" placeholder="Descrição do produto/serviço"></textarea>
            </div>
            <div class="mb-3">
                <label for="preco" class="form-label">Preço</label>
                <input type="number" class="form-control" id="preco" placeholder="Preço do produto/serviço">
            </div>
            <div class="mb-3">
                <label for="quantidade" class="form-label">Quantidade em Estoque</label>
                <input type="number" class="form-control" id="quantidade" value="0" disabled>
            </div>
            <div class="d-flex justify-content-between">
                <a href="produtos.html" class="btn btn-secondary">Voltar</a>
                <button type="reset" class="btn btn-warning">Limpar</button>
                <button type="submit" class="btn btn-success">Salvar</button>
            </div>
        </form>
    </div>
